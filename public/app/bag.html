<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8">
    <meta name="among-demons-client-version" content="f0d756dd357a">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Bag | Among Demons</title>
    <meta name="description" content="Manage extracted Demon Echoes, refine rarities, unravel Mythic Echoes, and summon permanent demons.">
    <link rel="icon" href="/app/images/amongdemons.ico" type="image/x-icon">
    <link href="/vendor/bootstrap/css/bootstrap.min.css?v=5.3.2" rel="stylesheet">
    <link href="/app/css/base.css?v=d00a50dcc4a1" rel="stylesheet">
    <link href="/app/css/bag.css?v=f77aad9c1af8" rel="stylesheet">
    <link href="/app/css/bag-item-visuals.css?v=eb4584c38950" rel="stylesheet">
  </head>
  <body class="bag-page">
    <nav class="navbar navbar-expand-xl navbar-dark bg-dark border-bottom game-shell-nav" aria-label="Game navigation">
      <div class="container-fluid">
        <a class="navbar-brand game-shell-brand" href="/" aria-label="Among Demons home">
          <img src="/app/images/amongdemons_logo_250x250.png" alt="Among Demons logo" class="logo-nav" width="40" height="40" loading="eager">
          <span class="game-shell-brand-copy"><span class="game-shell-brand-name">Among Demons</span></span>
        </a>
        <button class="navbar-toggler game-shell-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#bagGameNav" aria-controls="bagGameNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="bagGameNav">
          <ul class="navbar-nav game-shell-tabs me-auto">
            <li class="nav-item"><a class="nav-link game-nav-link" href="/dungeon" data-game-route="dungeon"><span class="game-nav-icon"><i data-lucide="swords"></i></span><span>Dungeon</span></a></li>
            <li class="nav-item"><a class="nav-link game-nav-link" href="/world" data-game-route="world"><span class="game-nav-icon"><i data-lucide="map"></i></span><span>World</span></a></li>
            <li class="nav-item"><a class="nav-link game-nav-link" href="/camp" data-game-route="camp"><span class="game-nav-icon"><i data-lucide="tent"></i></span><span>Camp</span></a></li>
            <li class="nav-item"><a class="nav-link game-nav-link active" href="/bag" data-game-route="bag" aria-current="page"><span class="game-nav-icon"><i data-lucide="amphora"></i></span><span>Bag</span></a></li>
            <li class="nav-item"><a class="nav-link game-nav-link" href="/collection" data-game-route="collection"><span class="game-nav-icon"><i data-lucide="grid-3x3"></i></span><span>Collection</span></a></li>
            <li class="nav-item"><a class="nav-link game-nav-link" href="/leaderboard" data-game-route="leaderboard"><span class="game-nav-icon"><i data-lucide="trophy"></i></span><span>Leaderboard</span></a></li>
            <li class="nav-item dropdown game-nav-dropdown">
              <button class="nav-link game-nav-link game-nav-dropdown-toggle" type="button" data-bs-toggle="dropdown" data-bs-auto-close="true" data-game-sections="demons bosses events" aria-expanded="false" aria-label="Open guides navigation"><span class="game-nav-icon"><i data-lucide="scroll-text"></i></span><span>Guides</span><span class="game-nav-caret"><i data-lucide="chevron-down" aria-hidden="true"></i></span></button>
              <ul class="dropdown-menu game-nav-dropdown-menu"><li><a class="dropdown-item game-nav-dropdown-item" href="/demons" data-game-route="demons"><span class="game-nav-icon"><i data-lucide="skull"></i></span><span>Demons</span></a></li><li><a class="dropdown-item game-nav-dropdown-item" href="/bosses" data-game-route="bosses"><span class="game-nav-icon"><i data-lucide="shield-alert"></i></span><span>Bosses</span></a></li><li><a class="dropdown-item game-nav-dropdown-item" href="/events" data-game-route="events"><span class="game-nav-icon"><i data-lucide="sparkles"></i></span><span>Events</span></a></li></ul>
            </li>
          </ul>
          <div class="nav-auth-actions game-shell-auth-actions" data-nav-auth-actions>
            <a class="btn btn-outline-light btn-sm" href="/login">Login</a>
            <a class="btn btn-primary btn-sm" href="/register">Register</a>
          </div>
          <div class="nav-account d-none" data-nav-account>
            <span class="nav-balance" data-nav-souls role="status" aria-live="polite" aria-atomic="true" title="Soul balance">
              <span class="soul-amount nav-soul-amount" aria-label="Souls loading">
                <img src="/app/images/assets/soul.svg" class="game-icon soul-icon" alt="" width="16" height="16" loading="lazy" aria-hidden="true">
                <span class="soul-amount-value">-</span><span class="soul-amount-label">Souls</span>
              </span>
            </span>
            <a class="nav-player" href="/camp" title="Go to camp">
              <span class="nav-player-avatar" aria-hidden="true"><img src="/app/images/demons/map/1.webp" alt="" width="34" height="34" loading="eager" data-nav-profile-image></span>
              <span class="nav-player-copy"><span data-nav-player-name></span><small data-nav-player-level>Level -</small></span>
            </a>
            <a class="nav-settings-link" href="/settings" title="Settings" aria-label="Settings"><i data-lucide="settings"></i></a>
            <button class="btn nav-logout-btn" id="logoutBtn" type="button" title="Logout" aria-label="Logout"><i data-lucide="log-out"></i></button>
          </div>
        </div>
      </div>
    </nav>

    <main class="container bag-main">
      <section class="card bag-vault-card" aria-labelledby="bagVaultTitle">
        <div class="card-header bag-toolbar">
          <div class="bag-toolbar-title">
            <a class="bag-back-link" id="bagBackLink" href="/" aria-label="Back to previous page" title="Back">
              <i data-lucide="chevron-left"></i>
            </a>
            <div class="bag-toolbar-copy">
              <h1 class="h4 mb-0" id="bagVaultTitle">Bag</h1>
              <small id="bagCount">0 stacks</small>
            </div>
          </div>
          <div class="bag-controls">
            <label class="visually-hidden" for="bagFilter">Item type</label>
            <select class="form-select form-select-sm" id="bagFilter" aria-label="Item type">
              <option value="all">All items</option>
              <option value="echo">Echoes</option>
            </select>
            <label class="visually-hidden" for="bagSort">Sort bag</label>
            <select class="form-select form-select-sm" id="bagSort" aria-label="Sort bag">
              <option value="type">Demon type</option>
              <option value="ready">Ready first</option>
              <option value="rarity">Rarity</option>
              <option value="name">Name</option>
              <option value="quantity">Quantity</option>
            </select>
          </div>
        </div>
        <div class="card-body">
          <div class="bag-loading" id="bagLoading" role="status">
            <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
            <span>Opening the vault...</span>
          </div>
          <div class="bag-grid-viewport" id="bagGridViewport">
            <div class="bag-grid" id="bagGrid" aria-live="polite"></div>
          </div>
        </div>
      </section>
    </main>

    <div class="bag-item-tooltip" id="bagItemTooltip" role="tooltip" hidden></div>

    <div class="modal fade bag-detail-modal" id="bagDetailModal" tabindex="-1" aria-labelledby="bagDetailTitle" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content" id="bagDetailContent"></div>
      </div>
    </div>

    <div class="modal fade bag-action-modal bag-summon-modal" id="bagSummonModal" tabindex="-1" aria-labelledby="bagSummonTitle" aria-describedby="bagSummonDescription" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" id="bagSummonContent"></div>
      </div>
    </div>

    <div class="modal fade bag-action-modal bag-refine-modal" id="bagRefineModal" tabindex="-1" aria-labelledby="bagRefineTitle" aria-describedby="bagRefineDescription" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" id="bagRefineContent"></div>
      </div>
    </div>
    <script src="/app/dist/runtime.bundle.js?v=d7b0cd386c9e"></script>
    <script src="/app/js/bag-item-visuals.js?v=004be680c695"></script>
    <script src="/app/js/bag-ui.js?v=e31e29b0ffe7"></script>
  </body>
</html>
