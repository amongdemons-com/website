<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Settings | Among Demons</title>
    <meta name="description" content="Manage your private Among Demons player settings.">
    <link rel="canonical" href="https://amongdemons.com/settings">
    <link rel="icon" href="/app/images/amongdemons.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/app/css/base.css?v=20260716-ambush-wins-v1" rel="stylesheet">
    <link href="/app/css/battle.css?v=20260716-replay-skip-v2" rel="stylesheet">
  </head>
  <body class="settings-page">
    <nav class="navbar navbar-expand-xl navbar-dark bg-dark border-bottom game-shell-nav" aria-label="Game navigation">
      <div class="container-fluid">
        <a class="navbar-brand game-shell-brand" href="/" aria-label="Among Demons home">
          <img src="/app/images/amongdemons_logo_250x250.png" alt="Among Demons logo" class="logo-nav" width="40" height="40" loading="eager">
          <span class="game-shell-brand-copy"><span class="game-shell-brand-name">Among Demons</span></span>
        </a>
        <button class="navbar-toggler game-shell-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#settingsGameNav" aria-controls="settingsGameNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="settingsGameNav">
          <ul class="navbar-nav game-shell-tabs me-auto">
            <li class="nav-item"><a class="nav-link game-nav-link" href="/world" data-game-route="world"><i data-lucide="map"></i><span>World</span></a></li>
            <li class="nav-item"><a class="nav-link game-nav-link" href="/camp" data-game-route="camp"><i data-lucide="tent"></i><span>Camp</span></a></li>
            <li class="nav-item"><a class="nav-link game-nav-link" href="/dungeon" data-game-route="dungeon"><i data-lucide="swords"></i><span>Dungeon</span></a></li>
            <li class="nav-item dropdown game-nav-dropdown">
              <button class="nav-link game-nav-link game-nav-dropdown-toggle" type="button" data-bs-toggle="dropdown" data-bs-auto-close="true" data-game-sections="demons bosses" aria-expanded="false" aria-label="Open guides navigation"><i data-lucide="scroll-text"></i><span>Guides</span><i data-lucide="chevron-down" class="game-nav-caret" aria-hidden="true"></i></button>
              <ul class="dropdown-menu game-nav-dropdown-menu"><li><a class="dropdown-item game-nav-dropdown-item" href="/demons" data-game-route="demons"><i data-lucide="skull"></i><span>Demons</span></a></li><li><a class="dropdown-item game-nav-dropdown-item" href="/bosses" data-game-route="bosses"><i data-lucide="shield-alert"></i><span>Bosses</span></a></li></ul>
            </li>
            <li class="nav-item"><a class="nav-link game-nav-link" href="/collection" data-game-route="collection"><i data-lucide="grid-3x3"></i><span>Collection</span></a></li>
            <li class="nav-item"><a class="nav-link game-nav-link" href="/rankings" data-game-route="rankings"><i data-lucide="trophy"></i><span>Rankings</span></a></li>
          </ul>
          <div class="nav-account d-none" data-nav-account>
            <span class="nav-balance" data-nav-souls role="status" aria-live="polite" aria-atomic="true" title="Soul balance">
              <span class="soul-amount nav-soul-amount" aria-label="Souls loading">
                <img src="/app/images/assets/soul.svg" class="ad-icon soul-icon" alt="" width="16" height="16" aria-hidden="true">
                <span class="soul-amount-value">-</span>
                <span class="soul-amount-label">Souls</span>
              </span>
            </span>
            <a class="nav-player" href="/camp" title="Go to camp">
              <span class="nav-player-avatar" aria-hidden="true"><img src="/app/images/demons/map/1.webp" alt="" width="34" height="34" data-nav-profile-image></span>
              <span class="nav-player-copy"><span data-nav-player-name></span><small data-nav-player-level>Level -</small></span>
            </a>
            <a class="nav-settings-link active" href="/settings" title="Settings" aria-label="Settings" aria-current="page"><i data-lucide="settings"></i></a>
            <button class="btn nav-logout-btn" id="logoutBtn" type="button" title="Logout" aria-label="Logout"><i data-lucide="log-out"></i></button>
          </div>
        </div>
      </div>
    </nav>

    <main class="settings-shell">
      <header class="settings-hero">
        <span class="settings-kicker"><i data-lucide="settings"></i> Hunter controls</span>
        <h1>Settings</h1>
      </header>

      <section class="settings-section" aria-labelledby="profileSettingsHeading">
        <header class="settings-section-header">
          <span class="settings-section-icon" aria-hidden="true"><i data-lucide="user-round"></i></span>
          <div>
            <h2 id="profileSettingsHeading">Profile</h2>
          </div>
        </header>

        <form id="usernameForm" class="settings-form" novalidate>
          <div class="settings-field">
            <label class="form-label" for="settingsUsername">Username</label>
            <input class="form-control" id="settingsUsername" name="username" autocomplete="username" minlength="3" maxlength="64" pattern="[A-Za-z0-9][A-Za-z0-9_-]*[A-Za-z0-9]" title="Use 3 to 64 letters, numbers, hyphens, or underscores. Start and end with a letter or number." required disabled>
          </div>
          <div class="settings-form-footer">
            <div class="d-none settings-message" id="settingsMessage" role="status" aria-live="polite" aria-atomic="true"></div>
            <button class="btn btn-primary settings-submit" id="saveUsernameButton" type="submit" disabled>
              <i data-lucide="save"></i>
              <span id="saveUsernameLabel">Save</span>
            </button>
          </div>
        </form>
      </section>

      <section class="settings-section" aria-labelledby="battleSettingsHeading">
        <header class="settings-section-header">
          <span class="settings-section-icon" aria-hidden="true"><i data-lucide="swords"></i></span>
          <div>
            <h2 id="battleSettingsHeading">Battle</h2>
          </div>
        </header>

        <div class="settings-form settings-battle-form">
          <div class="settings-field settings-toggle-field">
            <div class="form-check form-switch settings-toggle">
              <input class="form-check-input" type="checkbox" role="switch" id="settingsScreenShake" checked>
              <label class="form-check-label" for="settingsScreenShake">Chu Perk screen shake</label>
            </div>
          </div>
          <div class="settings-field settings-toggle-field">
            <div class="form-check form-switch settings-toggle">
              <input class="form-check-input" type="checkbox" role="switch" id="settingsCardShake" checked>
              <label class="form-check-label" for="settingsCardShake">Card shake</label>
            </div>
          </div>
          <div class="settings-field settings-toggle-field">
            <div class="form-check form-switch settings-toggle">
              <input class="form-check-input" type="checkbox" role="switch" id="settingsHideWinningAmbushes">
              <label class="form-check-label" for="settingsHideWinningAmbushes">Do not show winning ambushes</label>
            </div>
          </div>
        </div>
      </section>

      <section class="settings-section" aria-labelledby="audioSettingsHeading">
        <header class="settings-section-header">
          <span class="settings-section-icon" aria-hidden="true"><i data-lucide="sliders-horizontal"></i></span>
          <div>
            <h2 id="audioSettingsHeading">Audio</h2>
          </div>
        </header>

        <div class="settings-form settings-audio-form">
          <div class="settings-field settings-toggle-field settings-audio-mute-field">
            <div class="form-check settings-toggle">
              <input class="form-check-input" type="checkbox" id="settingsAudioMuted">
              <label class="form-check-label" for="settingsAudioMuted">Mute audio</label>
            </div>
          </div>

          <div class="settings-field settings-volume-field">
            <div class="settings-volume-heading">
              <label class="form-label" for="settingsMasterVolume">Master volume</label>
              <output id="settingsMasterVolumeValue" for="settingsMasterVolume">60%</output>
            </div>
            <input class="form-range settings-volume-range" id="settingsMasterVolume" type="range" min="0" max="100" step="1" value="60">
          </div>

          <div class="settings-field settings-volume-field">
            <div class="settings-volume-heading">
              <label class="form-label" for="settingsMusicVolume">Music</label>
              <output id="settingsMusicVolumeValue" for="settingsMusicVolume">50%</output>
            </div>
            <input class="form-range settings-volume-range" id="settingsMusicVolume" type="range" min="0" max="100" step="1" value="50">
          </div>

          <div class="settings-field settings-volume-field">
            <div class="settings-volume-heading">
              <label class="form-label" for="settingsSfxVolume">Effects</label>
              <output id="settingsSfxVolumeValue" for="settingsSfxVolume">75%</output>
            </div>
            <input class="form-range settings-volume-range" id="settingsSfxVolume" type="range" min="0" max="100" step="1" value="75">
          </div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/app/js/lucide-subset.js?v=20260713-boss-guides-v1"></script>
    <script src="/app/js/icons.js?v=20260715-guest-settings-v1"></script>
    <script src="/app/js/api-config.js?v=20260704-cache-v1"></script>
    <script src="/app/js/session.js?v=20260713-alert-demon-rarity-v1"></script>
    <script src="/app/js/steam.js?v=20260716-steam-exit-v1"></script>
    <script src="/app/js/usernames.js?v=20260701-hunter-profile-v1"></script>
    <script src="/app/js/audio.js?v=20260717-audio-default-on-v1"></script>
    <script src="/app/js/navigation.js?v=20260719-nav-groups-v1"></script>
    <script src="/app/js/settings-ui.js?v=20260716-ambush-wins-v1"></script>
  </body>
</html>
