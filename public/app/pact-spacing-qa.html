<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="/app/css/base.css" rel="stylesheet">
  </head>
  <body class="dungeon-page">
    <div class="demonic-pact-overlay">
      <button class="btn btn-outline-light demonic-pact-view-toggle" type="button">View Team</button>
      <div class="demonic-pact-stage">
        <div class="demonic-pact-stage-heading"><span class="dungeon-phase-eyebrow">Demonic Pacts</span><h2>Choose a Demonic Pact</h2></div>
        <div class="demonic-pact-grid">
          <button class="demonic-pact-card is-common" type="button"><span class="demonic-pact-icon"></span><span class="demonic-pact-rarity rarity-common">Common</span><strong>Quickening Curse</strong><span class="demonic-pact-description">Speed is increased by 10%.</span><span class="demonic-pact-tags"><span>speed</span></span></button>
          <button class="demonic-pact-card is-rare" type="button"><span class="demonic-pact-icon"></span><span class="demonic-pact-rarity rarity-rare">Rare</span><strong>Overflow Healing</strong><span class="demonic-pact-description">Excess healing becomes a temporary shield.</span><span class="demonic-pact-tags"><span>healing</span><span>shield</span></span></button>
          <button class="demonic-pact-card is-uncommon" type="button"><span class="demonic-pact-icon"></span><span class="demonic-pact-rarity rarity-uncommon">Uncommon</span><strong>Cursed Momentum</strong><span class="demonic-pact-description">Speed is increased by 20%, but single-target attack damage is reduced by 10%.</span><span class="demonic-pact-tags"><span>speed</span><span>tradeoff</span></span></button>
        </div>
        <div class="demonic-pact-actions"><div class="demonic-pact-reroll-cluster"><button class="btn btn-primary demonic-pact-reroll-btn" type="button">Recast</button><span class="soul-chip demonic-pact-reroll-cost">-76</span></div></div>
      </div>
    </div>
  </body>
</html>
